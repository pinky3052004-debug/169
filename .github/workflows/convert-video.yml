name: Convert 9:16 to 16:9 Video

on:
  workflow_dispatch:

jobs:
  process-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rclone
        uses: animalll/setup-rclone@v1 # သို့မဟုတ် rclone ကို တိုက်ရိုက် install လုပ်ရန်
        with:
          rclone_version: 'latest'

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Video from NanNanIphone
        run: |
          # Folder ID ဖြင့် နောက်ဆုံးထွက် ဗီဒီယိုဖိုင်ကို ဒေါင်းလုပ်ဆွဲခြင်း
          rclone copyto gdrive,root_folder_id="${{ secrets.INPUT_FOLDER_ID }}": input.mp4 --drive-import-formats mp4 || \
          rclone copy gdrive:NanNanIphone input.mp4 --max-age 1d
          # မှတ်ချက်။ သင့် Google Drive တည်ဆောက်ပုံအပေါ်မူတည်၍ rclone copyto (သို့) rclone copy ကို သုံးနိုင်ပါသည်။

      - name: Process Video (9:16 to 16:9 Blur Background)
        run: |
          ffmpeg -i input.mp4 -filter_complex "[0:v]scale=ih*16/9:ih,boxblur=s=40:p=3[bg];[0:v]scale=-1:1080[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2" -c:a copy output.mp4

      - name: Upload Video to NanNanIphone2
        run: |
          rclone copy output.mp4 gdrive,root_folder_id="${{ secrets.OUTPUT_FOLDER_ID }}"/
